name: Build Geode Mod

on:
  workflow_dispatch:
  push:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest

          - name: macOS
            os: macos-latest

          - name: iOS
            os: macos-latest
            target: iOS

          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: Build ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          # Use the Geode version declared in mod.json (5.11.0), which is
          # verified against GD 2.2081 instead of drifting with new releases.
          sdk: given
          combine: true
          target: ${{ matrix.config.target }}

      # If the SDK build fails, rerun its Ninja build so the useful compiler
      # diagnostics can be surfaced as GitHub annotations as well as raw logs.
      - name: Capture build diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          if [ -d build ]; then
            cmake --build build --config Release --verbose --parallel 2>&1 | tee build-diagnostics.log
            build_status=${PIPESTATUS[0]}
          else
            echo "No build directory was generated; the failure happened during CMake configuration." | tee build-diagnostics.log
            build_status=1
          fi
          grep -Ei 'error:|fatal error:|CMake Error|FAILED:|undefined reference|ld: error' build-diagnostics.log | tail -n 80 | while IFS= read -r line; do
            echo "::error title=Build diagnostic::$line"
            echo "$line" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "Diagnostic build exit code: $build_status" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ matrix.config.name }}
          path: build-diagnostics.log
          if-no-files-found: warn

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Upload combined .geode
        uses: actions/upload-artifact@v4
        with:
          name: CatHack-all-platforms
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
